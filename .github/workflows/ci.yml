name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leak guard (keys and Qloo-response-like data)
        run: npm run check-leaks
      - name: Type check (generates Next route types first, so a fresh clone passes)
        run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
